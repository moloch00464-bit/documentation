site_name: M.O.L.O.C.H. 3.0
site_description: M.O.L.O.C.H. 3.0 - Multi-Operational Learning & Optimization Cognitive Holographic System for Raspberry Pi
site_url: !ENV [SITE_URL, CF_PAGES_URL, "https://moloch00464-bit.github.io/documentation"]
repo_url: https://github.com/moloch00464-bit/documentation
repo_name: moloch00464-bit/documentation
remote_branch: !ENV [CF_PAGES_BRANCH, "next"]
docs_dir: source
site_dir: build
use_directory_urls: true
strict: true
validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn
    not_found: warn
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: relative_to_docs
theme:
  name: material
  language: en
  custom_dir: source/overrides
  logo: assets/images/hacs_logo.png
  favicon: assets/images/hacs_logo.png
  font:
    code: "Consolas"
    text: "Instrument Sans"
  features:
    - announce.dismiss
    - content.code.copy
    - content.footnote.tooltips
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  icon:
    annotation: material/information
plugins:
  - privacy
  - macros:
      on_undefined: strict
      include_dir: source/includes
      module_name: source/macros
  - search:
      lang: en
  - social:
      cards: true
      cards_layout_options:
        background_color: "#41BDF5"
  - tags
hooks:
  - source/hooks/html_tag_modifier.py
  - source/hooks/shortcodes.py
extra:
  resources:
    - link: https://github.com/hacs/.github/blob/master/CODE_OF_CONDUCT.md
      title: Code of Conduct
      icon: fontawesome/solid/scale-balanced
    - link: https://squidfunk.github.io/mkdocs-material/
      title: Made with Material for MkDocs
      icon: logo

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - source/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
extra_css:
  - assets/stylesheets/extra.css

not_in_nav: |
  includes/*
  glossary.md
  assets/images/screenshots/README.md
nav:
  - Home: index.md
  - Getting Started:
    - System Requirements: docs/requirements.md
    - Installation:
      - Raspberry Pi Setup: docs/installation/raspberry-pi.md
  - Features:
    - Overview: docs/features/index.md
  - Configuration:
    - Basic Setup: docs/configuration/basic.md
  - Usage:
    - Usage Guide: docs/usage/index.md
  - FAQ: docs/moloch-faq.md

